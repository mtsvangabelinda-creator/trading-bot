name: Run Full Backtest

on:
  workflow_dispatch:

jobs:
  run_backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env file
        run: |
          echo "KRAKEN_API_KEY=${{ secrets.KRAKEN_API_KEY }}" >> .env
          echo "KRAKEN_API_SECRET=${{ secrets.KRAKEN_API_SECRET }}" >> .env
          echo "KRAKEN_CANCEL_KEY=${{ secrets.KRAKEN_CANCEL_KEY }}" >> .env
          echo "KRAKEN_CANCEL_SECRET=${{ secrets.KRAKEN_CANCEL_SECRET }}" >> .env
          echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .env
          echo "TELEGRAM_AUTHORISED_USER_ID=${{ secrets.TELEGRAM_AUTHORISED_USER_ID }}" >> .env
          echo "ENVIRONMENT=backtest" >> .env
          echo "HEARTBEAT_FILE_PATH=data/heartbeat.txt" >> .env
          echo "HEARTBEAT_INTERVAL=60" >> .env
          echo "HEARTBEAT_TIMEOUT=300" >> .env

      - name: Create data directory
        run: mkdir -p data

      - name: Fetch 2 years historical data all assets
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          python -c "
          import asyncio
          from data.ohlcv_fetcher import OHLCVFetcher

          async def fetch():
              fetcher = OHLCVFetcher()
              await fetcher.init_database()
              assets = [
                  'BTC/USD',
                  'ETH/USD',
                  'SOL/USD',
                  'BNB/USD',
                  'XRP/USD'
             ]
             for asset in assets:
                 print(f'Fetching 2 years of {asset}...')
                 count = await fetcher.fetch_historical(
                     asset, '1d', 730
                 )
                 df = await fetcher.load_ohlcv(asset, '1d', 730)
                 if df is not None and len(df) > 0:
                     print(f'{asset}: {count} candles saved, range {df.index[0]} to {df.index[-1]}')
                 else:
                     print(f'{asset}: {count} candles saved, no data loaded')
    await fetcher.close()
    print('All historical data fetched.')

asyncio.run(fetch())
          "

      - name: Run backtest BTC/USD
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          python -c "
          import asyncio
          from data.ohlcv_fetcher import OHLCVFetcher
          from backtest.engine import run_backtest
          from backtest.metrics import (
              format_report,
              check_passes_criteria
          )

          async def run():
              fetcher = OHLCVFetcher()
              df = await fetcher.load_ohlcv('BTC/USD', '1d', 730)
              await fetcher.close()

              if df is None or len(df) < 200:
                  print('ERROR: Not enough BTC/USD data')
                  return

              print(f'BTC/USD: {len(df)} candles loaded')
              result = await run_backtest(
                  'BTC/USD', df,
                  initial_capital=10000.0,
                  start_date=None,
                  end_date=None
              )

              if result:
                  print(format_report(
                      result['metrics'],
                      'BTC/USD',
                      '2 years'
                  ))
                  criteria = check_passes_criteria(
                      result['metrics']
                  )
                  print(f'Passes criteria: {criteria[\"passed\"]}')
                  for k, v in criteria['details'].items():
                      print(f'  {k}: {v}')
              else:
                  print('BTC/USD backtest failed')

          asyncio.run(run())
          "

