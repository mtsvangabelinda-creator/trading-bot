      - name: Run stress tests
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          python -c "
          import asyncio
          from backtest.stress_test import (
              run_all_stress_tests,
              generate_stress_report
          )

          async def run():
              print('Running all stress tests...')
              results = await run_all_stress_tests()
              report  = generate_stress_report(results)
              print(report)

          asyncio.run(run())
          "

      - name: Final summary
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          python -c "
          print('')
          print('=' * 50)
          print('2 YEAR BACKTEST COMPLETE')
          print('All 5 assets tested on real Kraken data')
          print('Check results above for each asset')
          print('=' * 50)
          "
