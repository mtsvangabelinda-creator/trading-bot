name: Run Full Backtest

on:
  workflow_dispatch:

jobs:
  run_backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env file
        run: |
          echo "KRAKEN_API_KEY=${{ secrets.KRAKEN_API_KEY }}" >> .env
          echo "KRAKEN_API_SECRET=${{ secrets.KRAKEN_API_SECRET }}" >> .env
          echo "KRAKEN_CANCEL_KEY=${{ secrets.KRAKEN_CANCEL_KEY }}" >> .env
          echo "KRAKEN_CANCEL_SECRET=${{ secrets.KRAKEN_CANCEL_SECRET }}" >> .env
          echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .env
          echo "TELEGRAM_AUTHORISED_USER_ID=${{ secrets.TELEGRAM_AUTHORISED_USER_ID }}" >> .env
          echo "ENVIRONMENT=backtest" >> .env
          echo "HEARTBEAT_FILE_PATH=data/heartbeat.txt" >> .env
          echo "HEARTBEAT_INTERVAL=60" >> .env
          echo "HEARTBEAT_TIMEOUT=300" >> .env

      - name: Create data directory
        run: mkdir -p data

      - name: Walk-forward backtest BTC/USD
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          python -c "
          import asyncio
          from backtest.engine import (
              fetch_walk_forward_data,
              run_backtest
          )
          from backtest.metrics import (
              format_report,
              check_passes_criteria
          )
          from config import WALK_FORWARD_MONTHS

          async def run():
              asset = 'BTC/USD'
              print(f'Fetching walk-forward data for {asset}...')
              data = await fetch_walk_forward_data(asset)

              if data is None:
                  print(f'ERROR: Failed to fetch data for {asset}')
                  return

              print(f'1d: {len(data[\"df_1d\"])} candles')
              print(f'4h: {len(data[\"df_4h\"])} candles')
              print(f'1h: {len(data[\"df_1h\"])} candles')

              result = await run_backtest(
                  asset,
                  data['df_1d'], data['df_4h'], data['df_1h']
              )

              if result:
                  print(format_report(
                      result['metrics'], asset,
                      f'{WALK_FORWARD_MONTHS} months (walk-forward)'
                  ))
                  criteria = check_passes_criteria(
                      result['metrics']
                  )
                  print(f'Passes criteria: {criteria[\"passed\"]}')
                  for k, v in criteria['details'].items():
                      print(f'  {k}: {v}')
              else:
                  print(f'{asset} backtest failed')

          asyncio.run(run())
          "

